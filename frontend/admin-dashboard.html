<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Aprava Global Tech</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
<header class="admin-header">
  <div class="container admin-header-inner">
    <strong>Aprava Global Tech — Admin</strong>
    <button id="logout-button" class="button">Logout</button>
  </div>
</header>

<main class="section">
  <div class="container">
    <div class="section-heading">
      <div class="eyebrow">Dashboard</div>
      <h1>Enquiries</h1>
    </div>

    <div class="stats">
      <div class="stat-card"><span>Total</span><strong id="total-count">0</strong></div>
      <div class="stat-card"><span>New</span><strong id="new-count">0</strong></div>
      <div class="stat-card"><span>Contacted</span><strong id="contacted-count">0</strong></div>
      <div class="stat-card"><span>In Progress</span><strong id="progress-count">0</strong></div>
      <div class="stat-card"><span>Completed</span><strong id="completed-count">0</strong></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Name</th><th>Company</th><th>Email</th><th>Phone</th>
            <th>Service</th><th>Status</th><th>Created</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="enquiries-body"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
