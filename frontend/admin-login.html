<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Aprava Global Tech</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
<main class="section">
  <div class="container">
    <div class="form-card" style="margin: 80px auto;">
      <div class="eyebrow">Aprava Global Tech</div>
      <h1>Admin Login</h1>
      <form id="admin-login-form">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" required maxlength="100">
        </div>
        <br>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required maxlength="200">
        </div>
        <br>
        <button class="button primary" type="submit">Login</button>
        <div id="login-message" class="form-message" role="alert"></div>
      </form>
    </div>
  </div>
</main>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
